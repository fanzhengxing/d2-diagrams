<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[架构图标题]</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #020617;
  color: #e2e8f0;
  font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 2rem;
}
.container { max-width: 1200px; width: 100%; }
.header {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 2rem; border-bottom: 1px solid #1e293b; padding-bottom: 1rem;
}
.header h1 { font-size: 1.5rem; font-weight: 500; color: #f1f5f9; }
.pulse-dot {
  width: 10px; height: 10px; border-radius: 50%; background: #22d3ee;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(34,211,238,0.4); }
  70% { box-shadow: 0 0 0 10px rgba(34,211,238,0); }
  100% { box-shadow: 0 0 0 0 rgba(34,211,238,0); }
}
.diagram-container {
  background: #0f172a; border-radius: 12px; border: 1px solid #1e293b;
  padding: 2rem; overflow: auto; margin-bottom: 2rem;
}
.diagram-container svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.card {
  background: #0f172a; border: 1px solid #1e293b; border-radius: 8px;
  padding: 1.25rem; transition: border-color 0.2s;
}
.card:hover { border-color: #334155; }
.card-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; }
.card-dot { width: 6px; height: 6px; border-radius: 50%; }
.card-dot.cyan { background: #22d3ee; }
.card-dot.emerald { background: #34d399; }
.card-dot.violet { background: #a78bfa; }
.card-dot.amber { background: #fbbf24; }
.card-dot.rose { background: #fb7185; }
.card h3 { font-size: 0.85rem; font-weight: 500; color: #94a3b8; }
.card ul { list-style: none; }
.card li { font-size: 0.8rem; color: #cbd5e1; padding: 0.25rem 0; line-height: 1.5; }
.card li::before { content: "•"; color: #22d3ee; margin-right: 0.5rem; }
.footer { margin-top: 2rem; text-align: center; font-size: 0.75rem; color: #475569; border-top: 1px solid #1e293b; padding-top: 1rem; }
@media (max-width: 768px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="pulse-dot"></div>
    <h1>[架构图标题]</h1>
  </div>
  <div class="diagram-container">
    [SVG_CONTENT]
  </div>
  <div class="cards">
    <div class="card">
      <div class="card-header"><div class="card-dot cyan"></div><h3>[卡片1标题]</h3></div>
      <ul><li>• [项目1]</li><li>• [项目2]</li></ul>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-dot emerald"></div><h3>[卡片2标题]</h3></div>
      <ul><li>• [项目1]</li><li>• [项目2]</li></ul>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-dot violet"></div><h3>[卡片3标题]</h3></div>
      <ul><li>• [项目1]</li><li>• [项目2]</li></ul>
    </div>
  </div>
  <div class="footer">Generated by D2 · [项目名称] · [日期]</div>
</div>
</body>
</html>
